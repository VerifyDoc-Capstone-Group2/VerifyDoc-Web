<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revoke credential</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-neutral-100 font-[Inter,sans-serif] text-neutral-900">

  <!-- Backdrop + centered dialog -->
  <div id="backdrop" class="fixed inset-0 flex items-center justify-center bg-black/30 p-4">

    <div role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc"
         class="w-full max-w-[560px] rounded-3xl border border-neutral-200 bg-white px-5 pb-6 pt-8 text-center shadow-[0_28px_50px_-12px_rgba(0,0,0,0.18)] sm:px-[30px] sm:pb-[30px] sm:pt-[36px]">

      <h1 id="modal-title" class="text-2xl font-semibold tracking-tight text-black sm:text-[29px] sm:leading-tight">
        Revoke credential
      </h1>

      <p id="modal-desc" class="mt-4 text-base leading-6 text-neutral-400 sm:mt-[18px]">
        This credential will be marked as revoked.
      </p>

      <!-- Buttons: stacked on mobile, side by side and centered from sm up -->
      <div class="mt-6 flex flex-col gap-3 sm:mt-7 sm:flex-row sm:justify-center sm:gap-5">
        <button id="cancel" type="button"
                class="h-[52px] rounded-xl border border-red-600 bg-white text-lg text-red-600 transition hover:bg-red-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600 sm:h-[60px] sm:w-[138px] sm:text-xl">
          Cancel
        </button>
        <button id="confirm" type="button"
                class="h-[52px] rounded-xl bg-red-600 text-lg text-white transition hover:bg-red-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600 sm:h-[60px] sm:w-[130px] sm:text-xl">
          Revoke
        </button>
      </div>
    </div>
  </div>

  <script>
    
    const backdrop = document.getElementById("backdrop");
    const close = () => backdrop.classList.add("hidden");

    document.getElementById("cancel").addEventListener("click", close);
    document.getElementById("confirm").addEventListener("click", () => {

      close();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
