<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerifyDoc - QR Scanner</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F8FAFC] font-sans antialiased text-slate-800">

  <!-- Mobile Sidebar Overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/50 z-20 hidden md:hidden"></div>

  <div class="flex min-h-screen">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:sticky top-0 h-screen w-64 bg-[#0F172A] text-slate-300 flex flex-col justify-between p-4 z-30 transition-transform -translate-x-full md:translate-x-0 overflow-y-auto shrink-0">
      <div>
        <!-- Logo -->
        <div class="flex items-center gap-2 px-3 py-4 text-white font-bold text-xl">
          <div class="bg-blue-600 p-1.5 rounded-lg text-white">
            <i data-lucide="shield-check" class="w-6 h-6"></i>
          </div>
          <span>VerifyDoc</span>
        </div>

        <!-- Navigation Links -->
        <nav class="mt-6 space-y-1">
          <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span>Dashboard</span>
          </a>
          <a href="shared-credentials.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition">
            <i data-lucide="share-2" class="w-5 h-5"></i>
            <span>Shared Credentials</span>
          </a>
          <!-- Active Nav Link -->
          <a href="verify-credential.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white font-medium transition">
            <i data-lucide="file-check" class="w-5 h-5"></i>
            <span>Verify Credential</span>
          </a>
          <a href="verification-request-status.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition">
            <i data-lucide="clock" class="w-5 h-5"></i>
            <span>Verification Requests</span>
          </a>
          <a href="organization.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition">
            <i data-lucide="building-2" class="w-5 h-5"></i>
            <span>Organization</span>
          </a>
          <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white font-medium transition">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <!-- Footer Organization Badge -->
      <div class="border-t border-slate-800 pt-4 px-2 flex items-center gap-3">
        <div class="p-2 rounded-lg bg-slate-800 text-slate-300">
          <i data-lucide="building" class="w-5 h-5"></i>
        </div>
        <div class="text-xs">
          <p class="font-semibold text-white">TechCrush Solutions</p>
          <p class="text-slate-400">Verified Organization</p>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0">
      
      <!-- Top Header -->
      <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between gap-3">
        
        <div class="flex items-center gap-3 flex-1 sm:flex-initial">
          <!-- Mobile Menu Toggle Button -->
          <button id="mobileMenuBtn" class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-none shrink-0">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>

          <!-- Search Input -->
          <div class="relative w-full sm:w-80">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
              type="text" 
              placeholder="Search anything..." 
              class="w-full pl-9 pr-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>
        </div>

        <!-- User Profile & Notifications -->
        <div class="flex items-center gap-3 sm:gap-4 shrink-0">
          <button class="relative p-2 rounded-lg text-slate-500 hover:bg-slate-100 transition">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-blue-600 rounded-full"></span>
          </button>
          
          <div class="flex items-center gap-3 border-l border-slate-200 pl-3 sm:pl-4">
            <img 
              src="https://res.cloudinary.com/xnjupqaj/image/upload/v1790814913/Ellipse_160_epfvd1.png" 
              alt="John Doe" 
              class="w-8 h-8 sm:w-9 sm:h-9 rounded-full object-cover"
            />
            <div class="text-sm hidden sm:block">
              <p class="font-semibold text-slate-800 leading-none">John Doe</p>
              <p class="text-xs text-slate-500 mt-0.5">Employer</p>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Body Content -->
      <div class="p-4 sm:p-8 space-y-6 max-w-2xl">
        
        <!-- Back Navigation Button -->
        <div>
          <a href="verify-credential.html" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back</span>
          </a>
        </div>

        <!-- Title Header -->
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Scan QR Code</h1>
          <p class="text-xs text-slate-500 mt-1">Position the QR code inside the frame to scan.</p>
        </div>

        <!-- Camera / Viewfinder Box -->
        <div class="relative bg-[#0F172A] rounded-2xl p-6 sm:p-12 flex flex-col items-center justify-center min-h-[320px] sm:min-h-[380px] shadow-sm overflow-hidden">
          
          <!-- Scanner Target Reticle Frame -->
          <div class="relative w-56 h-56 sm:w-72 sm:h-72 border border-slate-700/60 rounded-2xl flex items-center justify-center bg-slate-900/40">
            
            <!-- Target Framing Corners -->
            <div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-white rounded-tl-lg"></div>
            <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-white rounded-tr-lg"></div>
            <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-white rounded-bl-lg"></div>
            <div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-white rounded-br-lg"></div>

            <!-- Center QR Icon -->
            <i data-lucide="qr-code" class="w-14 h-14 sm:w-16 sm:h-16 text-white/80"></i>
          </div>

        </div>

        <!-- Alternative Link Button -->
        <a 
          href="enter-credential-number.html" 
          class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold py-3.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2"
        >
          <i data-lucide="scan-line" class="w-4 h-4 text-slate-500"></i>
          <span>Enter Credential Number</span>
        </a>

      </div>
    </main>
  </div>

  <!-- External JS File -->
  <script src="js/scan-qr.js"></script>
</body>
</html>
