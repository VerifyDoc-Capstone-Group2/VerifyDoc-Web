name: Institution credential QR checks
on:
  push:
    branches: [fix/institution-credential-live-qr]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check Institution-Dashboard/institution-credential-details-api.js
      - run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const source = fs.readFileSync('Institution-Dashboard/institution-credential-details-api.js', 'utf8');
          if (!source.includes('"/qr"')) throw Error('QR endpoint missing');
          if (!source.includes('qrCodeDataUrl')) throw Error('QR response not rendered');
          if (!source.includes('qrContainer.replaceChildren()')) throw Error('Placeholder not cleared');
          EOF
