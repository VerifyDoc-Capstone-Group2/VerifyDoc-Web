name: Credential share history checks
on:
  push:
    branches: [fix/citizen-credential-share-history]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check Citizen-Dashboard/Js/credential-share-history.js
      - run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const html = fs.readFileSync('Citizen-Dashboard/Credential-Details.html','utf8');
          const js = fs.readFileSync('Citizen-Dashboard/Js/credential-share-history.js','utf8');
          if (!html.includes('id="shareHistoryList"') || !html.includes('src="./Js/credential-share-history.js"')) throw Error('Share history script not wired');
          if (html.includes('Microsoft Nigeria') || html.includes('ABC Tech')) throw Error('Sample sharing history remains');
          if (!js.includes('/credential-shares/mine') || !js.includes('share.credential?.credentialId === credentialId')) throw Error('Missing credential-specific API integration');
          EOF
