name: Institution credentials integration checks
on:
  push:
    branches: [integration/institution-credentials-list]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check Institution-Dashboard/institution-credentials-api.js
      - run: node --check Institution-Dashboard/institution-credential-details-api.js
      - run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          for (const [page, script] of [['Credentials.html','institution-credentials-api.js'],['Credential details.html','institution-credential-details-api.js']]) {
            if (!fs.readFileSync('Institution-Dashboard/' + page,'utf8').includes(script)) throw Error('Missing script ' + script);
          }
          EOF
