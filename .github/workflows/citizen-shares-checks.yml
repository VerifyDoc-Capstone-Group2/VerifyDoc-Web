name: Citizen shared credentials checks
on:
  push:
    branches: [integration/citizen-shared-credentials-live]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check Citizen-Dashboard/Js/shared-credentials-api.js
      - run: node --check Citizen-Dashboard/Js/shared-credential-details-api.js
      - run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          for (const [page, script] of [
            ['Shared-Credential.html', 'shared-credentials-api.js'],
            ['Shared-Credential-Details.html', 'shared-credential-details-api.js']
          ]) {
            if (!fs.readFileSync('Citizen-Dashboard/' + page, 'utf8').includes(script)) throw Error('Missing script on ' + page);
          }
          EOF
