name: Organization frontend checks
on:
  push:
    branches:
      - integration/organization-backend
  pull_request:
    branches:
      - main
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate organization JavaScript syntax
        run: |
          find Employer-dashbord/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check Authentication/Login/Verifydoc.js
      - name: Verify linked JavaScript assets
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'Employer-dashbord';
          for (const name of fs.readdirSync(root).filter(f => f.endsWith('.html'))) {
            const html = fs.readFileSync(path.join(root,name),'utf8');
            for (const match of html.matchAll(/<script[^>]+src="([^"]+\.js)"/g)) {
              if (/^https?:/.test(match[1])) continue;
              const file = path.join(root,match[1]);
              if (!fs.existsSync(file)) throw new Error(name + ': missing ' + file);
            }
          }
          EOF
