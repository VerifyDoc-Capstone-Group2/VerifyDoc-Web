<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VerifyDoc - A simple document verification platform"
    />
    <title>VerifyDoc</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- For Croppie -->
    <link rel="stylesheet" href="../../node_modules/croppie/croppie.css" />
    <script src="../../node_modules/croppie/croppie.js"></script>
    <!-- For Toastify -->
    <link rel="stylesheet" href="../../node_modules/toastify-js/src/toastify.css" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },

            colors: {
              primary: "#2563EB",
              dark: "#0F172A",
              muted: "#64748B",
            },

            boxShadow: {
              soft: "0 10px 40px rgba(15, 23, 42, 0.08)",
            },

            animation: {
              float: "float 6s ease-in-out infinite",
              blob: "blob 12s ease-in-out infinite",
              marquee: "marquee 22s linear infinite",
              pulseSoft: "pulseSoft 3s ease-in-out infinite",
              rotate: "rotate 2s ease-in-out",
              slide: "slide 10s ease-in-out infinite",
              reveal: "reveal 0.8s ease-out forwards",
            },

            keyframes: {
              float: {
                "0%, 100%": {
                  transform: "translateY(0)",
                },
                "50%": {
                  transform: "translateY(-12px)",
                },
              },

              blob: {
                "0%, 100%": {
                  transform: "translate(0, 0) scale(1)",
                },
                "33%": {
                  transform: "translate(25px, -30px) scale(1.08)",
                },
                "66%": {
                  transform: "translate(-20px, 20px) scale(.94)",
                },
              },

              marquee: {
                "0%": {
                  transform: "translateX(0)",
                },
                "100%": {
                  transform: "translateX(-50%)",
                },
              },

              pulseSoft: {
                "0%, 100%": {
                  opacity: ".45",
                },
                "50%": {
                  opacity: "1",
                },
              },

              rotate: {
                "0%": {
                  transform: "rotate(0deg)",
                },
                "100%": {
                  transform: "rotate(360deg)",
                },
              },

              slide: {
                "0%, 100%": {
                  transform: "translateX(0)",
                },
                "50%": {
                  transform: "translateX(500px)",
                },
              },

              reveal: {
                "0%": {
                  opacity: "0",
                  transform: "translateY(40px)",
                },
                "100%": {
                  opacity: "1",
                  transform: "translateY(0)",
                },
              },
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="flex flex-col items-center font-inter text-dark bg-slate-100 bg-[linear-gradient(to_right,rgba(37,99,235,0.08)_1px,transparent_1px),linear-gradient(to_bottom,rgba(37,99,235,0.08)_1px,transparent_1px)] bg-[size:40px_40px]"
  >
    <!-- NAVBAR -->
    <header
      class="bg-blue-500/10 backdrop-blur-xl w-full border-b border-blue-200/20 sticky top-0 z-20"
    >
      <nav
        class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between"
      >
        <a href="../../index.html" class="flex items-center gap-2">
          <div
            class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center"
          >
            <span class="text-white font-bold">V</span>
          </div>

          <div class="text-xl font-bold tracking-tight">
            Verify<span class="text-primary">Doc</span>
          </div>
        </a>
      </nav>
    </header>

    <section
      class="p-4 flex flex-col mt-5 gap-y-6 max-w-full lg:w-1/2 items-center lg:mt-10 lg:p-0"
    >
      <!--Heading text-->
      <div class="flex flex-col gap-y-2 text-center">
        <h3
          class="text-[28px] font-[Inter] lg:text-[40px] font-extrabold text-[#171717]"
          id="header"
        ></h3>
      </div>

      <!-- Profile Picture Upload -->
      <div class="profile-upload relative h-[250px] w-[250px]">
        
        <label for="profile-picker" class="avatar-label group relative block h-full w-full overflow-hidden rounded-full border-3 border-[#ccc] cursor-pointer">
          
          
          <img src="/images/user.avif" alt="Profile Picture" class="h-full w-full object-cover" id="avatar-preview">
          
          
          <div class="upload-overlay absolute bottom-4 left-0 w-full bg-black/60 py-1.25 text-center text-[16px] text-white opacity-0 transition-opacity duration-300 group-hover:opacity-100">
            Change Photo
          </div>
        </label>

        
        <input type="file" name="profile_picture" id="profile-picker" accept="image/png, image/jpeg, image/webp" class="hidden" onchange="previewImage(event)"/>
      </div>

      
      <dialog id="cropper-modal" class="rounded-lg p-6 shadow-2xl backdrop:bg-black/50 backdrop:backdrop-blur-sm w-[90%] max-w-[400px]">
        <h3 class="text-lg font-bold text-gray-800 mb-4 text-center">Crop Your Profile Picture</h3>
        
        
        <div id="cropper-container" class="mx-auto mb-4"></div>
        
        
        <div class="flex justify-end gap-3">
          <button type="button" id="cancel-crop" class="px-4 py-2 border rounded-md text-gray-600 hover:bg-gray-50">
            Cancel
          </button>
          <button type="button" id="save-crop" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
            Save Changes
          </button>
        </div>
      </dialog>


      <!--Skip text-->
      <div class="mb-5 mt-12 flex items-center justify-center flex-col gap-y-1 text-center lg:mb-10">
        <a
          href="../Login/login.html"
          class="font-[Inter] cursor-pointer text-white font-bold"
        >
          <span class="bg-[#155eef] px-4 py-2 rounded-lg">Skip</span>
        </a>
      </div>
    </section>

    <script src="../../node_modules/toastify-js/src/toastify.js"></script>
    <script src="Profile_picture.js"></script>
  </body>
</html>
