<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VerifyDoc - A simple document verification platform"
    />
    <title>VerifyDoc</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- For Toastify -->
     <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="../../node_modules/toastify-js/src/toastify.css" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },

            colors: {
              primary: "#2563EB",
              dark: "#0F172A",
              muted: "#64748B",
            },

            boxShadow: {
              soft: "0 10px 40px rgba(15, 23, 42, 0.08)",
            },

            animation: {
              float: "float 6s ease-in-out infinite",
              blob: "blob 12s ease-in-out infinite",
              marquee: "marquee 22s linear infinite",
              pulseSoft: "pulseSoft 3s ease-in-out infinite",
              rotate: "rotate 2s ease-in-out",
              slide: "slide 10s ease-in-out infinite",
              reveal: "reveal 0.8s ease-out forwards",
            },

            keyframes: {
              float: {
                "0%, 100%": {
                  transform: "translateY(0)",
                },
                "50%": {
                  transform: "translateY(-12px)",
                },
              },

              blob: {
                "0%, 100%": {
                  transform: "translate(0, 0) scale(1)",
                },
                "33%": {
                  transform: "translate(25px, -30px) scale(1.08)",
                },
                "66%": {
                  transform: "translate(-20px, 20px) scale(.94)",
                },
              },

              marquee: {
                "0%": {
                  transform: "translateX(0)",
                },
                "100%": {
                  transform: "translateX(-50%)",
                },
              },

              pulseSoft: {
                "0%, 100%": {
                  opacity: ".45",
                },
                "50%": {
                  opacity: "1",
                },
              },

              rotate: {
                "0%": {
                  transform: "rotate(0deg)",
                },
                "100%": {
                  transform: "rotate(360deg)",
                },
              },

              slide: {
                "0%, 100%": {
                  transform: "translateX(0)",
                },
                "50%": {
                  transform: "translateX(500px)",
                },
              },

              reveal: {
                "0%": {
                  opacity: "0",
                  transform: "translateY(40px)",
                },
                "100%": {
                  opacity: "1",
                  transform: "translateY(0)",
                },
              },
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="flex flex-col items-center font-inter text-dark bg-slate-100 bg-[linear-gradient(to_right,rgba(37,99,235,0.08)_1px,transparent_1px),linear-gradient(to_bottom,rgba(37,99,235,0.08)_1px,transparent_1px)] bg-[size:40px_40px]"
  >
    <!-- NAVBAR -->
    <header
      class="bg-blue-500/10 backdrop-blur-xl w-full border-b border-blue-200/20 sticky top-0 z-20"
    >
      <nav
        class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between"
      >
        <a href="../../index.html" class="flex items-center gap-2">
          <div
            class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center"
          >
            <span class="text-white font-bold">V</span>
          </div>

          <div class="text-xl font-bold tracking-tight">
            Verify<span class="text-primary">Doc</span>
          </div>
        </a>
      </nav>
    </header>
    <section
      class="p-4 flex flex-col mt-5 gap-y-6 max-w-full lg:w-1/2 items-center lg:mt-10 lg:p-0"
    >
      <!--Heading text-->
      <div class="flex flex-col gap-y-2 text-center">
        <h3
          class="text-[28px] font-[Inter] lg:text-[40px] font-extrabold text-[#171717]"
          id="header"
        ></h3>
        <span
          class="text-base text-[#737373] lg:text-[18px] font-medium font-[Inter]"
          >Create your account to create and share credentials</span
        >
      </div>

      <!--Input form-->
      <form action="" class="flex flex-col gap-y-8 w-full">
        <!--Input field-->
        <div class="flex flex-col gap-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col gap-y-2">
              <label class="text-xs font-[Inter] text-[#111827]"
                >First name</label
              >
              <input
                type="text"
                class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
                placeholder="John"
                id="firstName"
              />
            </div>
            <div class="flex flex-col gap-y-2">
              <label class="text-xs font-[Inter] text-[#111827]"
                >Last name</label
              >
              <input
                type="text"
                class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
                placeholder="Doe"
                id="last_name"
              />
            </div>
          </div>
          
          <div class="flex flex-col gap-y-2">
            <label class="text-xs font-[Inter] text-[#111827]" id="email_text"
              >Email Address</label
            >
            <input
              type="email"
              class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
              placeholder="johndoe@gmail.com"
              id="email"
            />
          </div>

          <div class="flex flex-col gap-y-2" >
            <label class="text-xs font-[Inter] text-[#111827]"
              >Phone Number <span class="text-gray-500">(Optional)</span></label
            >
            <input
              type="tel"
              class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
              placeholder="+234 801 234 2345"
              id="phoneNumber"
            />
          </div>

          <div class="flex flex-col gap-y-2">
            <label class="text-xs font-[Inter] text-[#111827]">Password</label>
            <input
              type="password"
              class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
              placeholder="••••••••"
              id="password"
            />

            <!-- <p class="text-xs font-[Inter] text-[#111827]" id="digit">
              password must be more than 8digits
            </p> -->
          </div>
          <div class="flex flex-col gap-y-2">
            <label class="text-xs font-[Inter] text-[#111827]"
              >Confirm password</label
            >
            <input
              type="password"
              class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
              placeholder="••••••••"
              id="confirm_password"
            />
          </div>

          <!-- Password error message -->
           <p id="passwordErrorMessage" class="text-red-500 text-xs"></p>
        </div>
        <!--buttons-->

        <div class="flex flex-col gap-y-4">
          <button
            type="submit"
            class="bg-[#155eef] text-white py-2.5 font-[Inter] cursor-pointer hover:bg-[#0b1f3a] px-5 rounded-lg disabled:cursor-not-allowed disabled:opacity-50"
            id="create_account"
          >
            Create account
          </button>
          <a
            href="../../Verify_register.html"
            class="border border-[#155eef] py-2.5 text-center font-[Inter] cursor-pointer px-5 rounded-lg text-[#155eef]"
          >
            Back
          </a>
        </div>
      </form>

      <!--Login text-->
      <div class="mb-5 flex flex-col gap-y-1 text-center lg:mb-10">
        <span class="text-[#404040] font-[Inter]">Already have an account?</span
        ><a
          href="../Login/login.html"
          class="font-[Inter] cursor-pointer text-[#155eef] font-bold"
        >
          Login
        </a>
      </div>
    </section>

    <script src="../../node_modules/toastify-js/src/toastify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../Signup.js"></script>
  </body>
</html>
