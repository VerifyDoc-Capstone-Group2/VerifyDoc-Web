<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VerifyDoc - A simple document verification platform"
    />
    <title>VerifyDoc</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="Verifydoc.js" defer></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },

            colors: {
              primary: "#2563EB",
              dark: "#0F172A",
              muted: "#64748B",
            },

            boxShadow: {
              soft: "0 10px 40px rgba(15, 23, 42, 0.08)",
            },

            animation: {
              float: "float 6s ease-in-out infinite",
              blob: "blob 12s ease-in-out infinite",
              marquee: "marquee 22s linear infinite",
              pulseSoft: "pulseSoft 3s ease-in-out infinite",
              rotate: "rotate 2s ease-in-out",
              slide: "slide 10s ease-in-out infinite",
              reveal: "reveal 0.8s ease-out forwards",
            },

            keyframes: {
              float: {
                "0%, 100%": {
                  transform: "translateY(0)",
                },
                "50%": {
                  transform: "translateY(-12px)",
                },
              },

              blob: {
                "0%, 100%": {
                  transform: "translate(0, 0) scale(1)",
                },
                "33%": {
                  transform: "translate(25px, -30px) scale(1.08)",
                },
                "66%": {
                  transform: "translate(-20px, 20px) scale(.94)",
                },
              },

              marquee: {
                "0%": {
                  transform: "translateX(0)",
                },
                "100%": {
                  transform: "translateX(-50%)",
                },
              },

              pulseSoft: {
                "0%, 100%": {
                  opacity: ".45",
                },
                "50%": {
                  opacity: "1",
                },
              },

              rotate: {
                "0%": {
                  transform: "rotate(0deg)",
                },
                "100%": {
                  transform: "rotate(360deg)",
                },
              },

              slide: {
                "0%, 100%": {
                  transform: "translateX(0)",
                },
                "50%": {
                  transform: "translateX(500px)",
                },
              },

              reveal: {
                "0%": {
                  opacity: "0",
                  transform: "translateY(40px)",
                },
                "100%": {
                  opacity: "1",
                  transform: "translateY(0)",
                },
              },
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="flex flex-col items-center font-inter text-dark bg-slate-100 bg-[linear-gradient(to_right,rgba(37,99,235,0.08)_1px,transparent_1px),linear-gradient(to_bottom,rgba(37,99,235,0.08)_1px,transparent_1px)] bg-[size:40px_40px]"
  >
    <!-- NAVBAR -->
    <header
      class="bg-blue-500/10 backdrop-blur-xl w-full border-b border-blue-200/20 sticky top-0 z-20"
    >
      <nav
        class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between"
      >
        <a href="../../index.html" class="flex items-center gap-2">
          <div
            class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center"
          >
            <span class="text-white font-bold">V</span>
          </div>

          <div class="text-xl font-bold tracking-tight">
            Verify<span class="text-primary">Doc</span>
          </div>
        </a>
      </nav>
    </header>
    <section class="p-4 flex flex-col gap-y-6 w-full lg:w-1/2 lg:p-0">
      <!--Heading text-->
      <div class="flex flex-col gap-y-2 text-center">
        <h3
          class="text-[28px] font-[Inter] lg:text-[40px] font-extrabold text-[#171717]"
          id="header"
        ></h3>
        <span
          class="text-base text-[#737373] lg:text-[18px] font-medium font-[Inter]"
          id="text"
        ></span>
      </div>

      <!--Input form-->
      <form action="" class="flex flex-col gap-y-8">
        <!--Input field-->
        <div class="flex flex-col gap-y-4">
          <div class="flex flex-col gap-y-2">
            <label class="text-xs font-[Inter] text-[#111827]"
              >Organization name</label
            >
            <input
              type="text"
              class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
              placeholder="John Doe"
              id="organization_name"
            />
          </div>
          <div class="flex flex-col gap-y-2">
            <label class="text-xs font-[Inter] text-[#111827]"
              >Organization type</label
            >
            <input
              type="text"
              class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
              placeholder="School, Company etc.."
              id="organization_type"
            />
          </div>
          <div class="flex flex-col gap-y-2">
            <label class="text-xs font-[Inter] text-[#111827]"
              >Phone number</label
            >
            <input
              type=""
              class="rounded-lg border border-[#D1D5DB] p-3 outline-none font-[Inter]"
              placeholder="+234 1234983920"
              id="number"
              maxlength="11"
            />
          </div>
        </div>

        <!--buttons-->
        <div class="flex flex-col gap-y-4">
          <button
            type="submit"
            class="bg-[#155eef] text-white py-2.5 font-[Inter] cursor-pointer hover:bg-[#0b1f3a] px-5 rounded-lg disabled:cursor-not-allowed disabled:opacity-50"
            id="submit_application"
          >
            Submit application
          </button>
          <button
            class="border border-[#155eef] py-2.5 font-[Inter] cursor-pointer px-5 rounded-lg text-[#155eef]"
          >
            Back
          </button>
        </div>
      </form>

      <!--Login text-->
      <div class="mb-5 flex flex-col gap-y-1 text-center lg:mb-10">
        <span class="text-[#404040] font-[Inter]">Already have an account?</span
        ><a
          href="../Login/login.html"
          class="font-[Inter] cursor-pointer text-[#155eef] font-bold"
        >
          Login
        </a>
      </div>
    </section>

    <script src="../Details.js"></script>
  </body>
</html>
