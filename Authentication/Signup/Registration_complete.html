<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VerifyDoc - A simple document verification platform"
    />
    <title>VerifyDoc</title>
  <script src="Registration.js" defer></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- For Toastify -->
    <link rel="stylesheet" href="../../node_modules/toastify-js/src/toastify.css" />


    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },

            colors: {
              primary: "#2563EB",
              dark: "#0F172A",
              muted: "#64748B",
            },

            boxShadow: {
              soft: "0 10px 40px rgba(15, 23, 42, 0.08)",
            },

            animation: {
              float: "float 6s ease-in-out infinite",
              blob: "blob 12s ease-in-out infinite",
              marquee: "marquee 22s linear infinite",
              pulseSoft: "pulseSoft 3s ease-in-out infinite",
              rotate: "rotate 2s ease-in-out",
              slide: "slide 10s ease-in-out infinite",
              reveal: "reveal 0.8s ease-out forwards",
            },

            keyframes: {
              float: {
                "0%, 100%": {
                  transform: "translateY(0)",
                },
                "50%": {
                  transform: "translateY(-12px)",
                },
              },

              blob: {
                "0%, 100%": {
                  transform: "translate(0, 0) scale(1)",
                },
                "33%": {
                  transform: "translate(25px, -30px) scale(1.08)",
                },
                "66%": {
                  transform: "translate(-20px, 20px) scale(.94)",
                },
              },

              marquee: {
                "0%": {
                  transform: "translateX(0)",
                },
                "100%": {
                  transform: "translateX(-50%)",
                },
              },

              pulseSoft: {
                "0%, 100%": {
                  opacity: ".45",
                },
                "50%": {
                  opacity: "1",
                },
              },

              rotate: {
                "0%": {
                  transform: "rotate(0deg)",
                },
                "100%": {
                  transform: "rotate(360deg)",
                },
              },

              slide: {
                "0%, 100%": {
                  transform: "translateX(0)",
                },
                "50%": {
                  transform: "translateX(500px)",
                },
              },

              reveal: {
                "0%": {
                  opacity: "0",
                  transform: "translateY(40px)",
                },
                "100%": {
                  opacity: "1",
                  transform: "translateY(0)",
                },
              },
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="flex flex-col items-center font-inter text-dark bg-slate-100 bg-[linear-gradient(to_right,rgba(37,99,235,0.08)_1px,transparent_1px),linear-gradient(to_bottom,rgba(37,99,235,0.08)_1px,transparent_1px)] bg-[size:40px_40px]"
  >
    <!-- NAVBAR -->
    <header
      class="bg-blue-500/10 backdrop-blur-xl w-full border-b border-blue-200/20 sticky top-0 z-20"
    >
      <nav
        class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between"
      >
        <a href="../../index.html" class="flex items-center gap-2">
          <div
            class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center"
          >
            <span class="text-white font-bold">V</span>
          </div>

          <div class="text-xl font-bold tracking-tight">
            Verify<span class="text-primary">Doc</span>
          </div>
        </a>
      </nav>
    </header>
    <section class="p-4 flex flex-col items-center gap-y-8 lg:p-0">
      <!--Heading text-->
      <div class="flex flex-col gap-y-2 text-center items-center">
        <h3
          class="text-[28px] font-[Inter] lg:text-[40px] font-extrabold text-[#171717]"
        >
          Registration Complete
        </h3>
        <span
          class="text-base text-[#737373] lg:text-base max-w-full lg:w-1/2 text-center font-medium font-[Inter]"
          >We've sent a 6-digit verification code to your email. Kindly check
          and enter the code below to continue.</span
        >
      </div>

      <!--input section for code-->
      <div class="gap-x-2 flex items-center lg:gap-x-6">
        <input
          type="text"
          maxlength="1"
          class="text-[24px] font-bold flex items-center justify-center rounded-lg border border-[#D1D5DB] p-1 text-center outline-none font-[Inter] max-w-full max-h-full w-11 h-13"
        />
        <input
          type="text"
          maxlength="1"
          class="text-[24px] font-bold flex items-center justify-center rounded-lg border border-[#D1D5DB] p-1 text-center outline-none font-[Inter] max-w-full max-h-full w-11 h-13"
        />
        <input
          type="text"
          maxlength="1"
          class="text-[24px] font-bold flex items-center justify-center rounded-lg border border-[#D1D5DB] p-1 text-center outline-none font-[Inter] max-w-full max-h-full w-11 h-13"
        />
        <input
          type="text"
          maxlength="1"
          class="text-[24px] font-bold flex items-center justify-center rounded-lg border border-[#D1D5DB] p-1 text-center outline-none font-[Inter] max-w-full max-h-full w-11 h-13"
        />
        <input
          type="text"
          maxlength="1"
          class="text-[24px] font-bold flex items-center justify-center rounded-lg border border-[#D1D5DB] p-1 text-center outline-none font-[Inter] max-w-full max-h-full w-11 h-13"
        />
        <input
          type="text"
          maxlength="1"
          class="text-[24px] font-bold flex items-center justify-center rounded-lg border border-[#D1D5DB] p-1 text-center outline-none font-[Inter] max-w-full max-h-full w-11 h-13"
        />
      </div>

      <span
        class="text-base text-[#737373] lg:text-base max-w-full w-1/2 text-center font-medium font-[Inter]"
        >Resend code: <b>00:30</b></span
      >

      <div class="flex flex-col gap-y-3">
        <span class="text-[#404040] font-[Inter]">Didn’t receive a code?</span
        ><button class="font-[Inter] cursor-pointer text-[#155eef] font-bold">
          Resend Code
        </button>
      </div>
    </section>

    <script src="../../node_modules/toastify-js/src/toastify.js"></script>
    <script src="Registration.js"></script>
  </body>
</html>
