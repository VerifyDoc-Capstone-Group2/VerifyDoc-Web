<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VerifyDoc - A simple document verification platform">
    <title>VerifyDoc</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="Verifydoc.js" defer></script>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    inter: ["Inter", "sans-serif"],
                },

                colors: {
                    primary: "#2563EB",
                    dark: "#0F172A",
                    muted: "#64748B",
                },

                boxShadow: {
                    soft: "0 10px 40px rgba(15, 23, 42, 0.08)",
                },

                animation: {
                    float: "float 6s ease-in-out infinite",
                    blob: "blob 12s ease-in-out infinite",
                    marquee: "marquee 22s linear infinite",
                    pulseSoft: "pulseSoft 3s ease-in-out infinite",
                    rotate: "rotate 2s ease-in-out",
                    slide: "slide 10s ease-in-out infinite",
                     reveal: "reveal 0.8s ease-out forwards",
                },

                keyframes: {
                    float: {
                        "0%, 100%": {
                            transform: "translateY(0)",
                        },
                        "50%": {
                            transform: "translateY(-12px)",
                        },
                    },

                    blob: {
                        "0%, 100%": {
                            transform: "translate(0, 0) scale(1)",
                        },
                        "33%": {
                            transform: "translate(25px, -30px) scale(1.08)",
                        },
                        "66%": {
                            transform: "translate(-20px, 20px) scale(.94)",
                        },
                    },

                    marquee: {
                        "0%": {
                            transform: "translateX(0)",
                        },
                        "100%": {
                            transform: "translateX(-50%)",
                        },
                    },

                    pulseSoft: {
                        "0%, 100%": {
                            opacity: ".45",
                        },
                        "50%": {
                            opacity: "1",
                        },
                    },

                    rotate: {
                        "0%": {
                            transform: "rotate(0deg)",
                        },
                        "100%": {
                            transform: "rotate(360deg)",
                        },
                    },

                    slide: {
                        "0%, 100%": {
                            transform: "translateX(0)",
                        },
                        "50%": {
                            transform: "translateX(500px)",
                        },
                    },

                    reveal: {
        "0%": {
            opacity: "0",
            transform: "translateY(40px)",
        },
        "100%": {
            opacity: "1",
            transform: "translateY(0)",
        },
    }
                },
            },
        },
    };
</script>
</head>

<body class="font-inter text-dark bg-slate-100 bg-[linear-gradient(to_right,rgba(37,99,235,0.08)_1px,transparent_1px),linear-gradient(to_bottom,rgba(37,99,235,0.08)_1px,transparent_1px)] bg-[size:40px_40px]">


     <!-- NAVBAR -->
    <header class="bg-blue-500/10 backdrop-blur-xl border-b border-blue-200/20  sticky top-0 z-20">
        <nav class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between">

            
            <a href="VerifyDOC.html" class="flex items-center gap-2">
                <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold">V</span>
                </div>

                <div class="text-xl font-bold tracking-tight">
                    Verify<span class="text-primary">Doc</span>
                </div>
            </a>
            
        </nav>
            
    </header>

    <main class="bg-white shadow-soft rounded-lg p-8 max-w-md mx-auto mt-12">
        <h1 class="text-2xl font-bold text-center">Create your account</h1>
        <p class="text-center text-slate-500 text-muted mt-2">Create your account to manage and share your credentials.</p>
        <form id="loginForm" class="flex flex-col mt-6 gap-4">
            <div class="flex flex-col gap-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
                    <input type="email" id="email" name="email" placeholder="ada@example.com" class="mt-1 p-2 block w-full border border-slate-400 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                    <input type="password" id="password"  name="password" placeholder="••••••••" class="mt-1 p-2 block w-full border border-slate-400 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm Password</label>
                    <input type="password" id="confirmPassword"  name="confirmPassword" placeholder="••••••••" class="mt-1 p-2 block w-full border border-slate-400 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" id="signupBtn" class="px-4 py-2 mt-4 bg-primary text-white rounded-md hover:bg-blue-700 transition">Sign up</button>
                <a href="VerifyRegister.html" class="text-primary  border border-blue-500 hover:bg-blue-50 rounded-md py-2 px-4 text-center font-medium">Back</a>
            </div>
        </form>

        <p class="text-center text-sm text-muted mt-4">
            Already have an account? <a href="Login.html" class="text-primary hover:underline">Log in</a></p>

    </main>

    <footer class="bg-dark text-white mt-16">

        <div class="max-w-7xl mx-auto px-6 lg:px-8 py-10">

            <div class="flex flex-col md:flex-row justify-between gap-6">

                <div>
                    <div class="text-xl font-bold"> Verify <span class="text-blue-400">Doc</span></div>

                    <p class="mt-2 text-sm text-slate-400"> Digital credential verification platform.</p>
                </div>

                <p class="text-sm text-slate-400">
                    © 2026 VerifyDoc. All rights reserved.
                </p>

            </div>

        </div>

    </footer>
    
    </body>
    </html>
